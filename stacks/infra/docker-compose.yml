networks:
  server-net:
    external: true

services:

  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    network_mode: host          # required for DHCP broadcasts to reach LAN devices
    environment:
      TZ: ${TZ}
      FTLCONF_webserver_api_password: ${PIHOLE_PASSWORD}
      FTLCONF_webserver_port: "8053"   # admin UI on :8053 instead of :80
    volumes:
      - /opt/pihole/etc:/etc/pihole
      - /opt/pihole/dnsmasq:/etc/dnsmasq.d
    cap_add:
      - NET_ADMIN
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    command: tunnel --no-autoupdate run
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    restart: unless-stopped
    networks:
      - server-net

  glance:
    image: glanceapp/glance:latest
    container_name: glance
    ports:
      - "8080:8080"
    environment:
      PIHOLE_PASSWORD: ${PIHOLE_PASSWORD}
      IMMICH_API_KEY: ${IMMICH_API_KEY}
      NEXTCLOUD_APP_TOKEN: ${NEXTCLOUD_APP_TOKEN}
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER}
    volumes:
      - /opt/glance:/app/assets
      - ./config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /mnt/ssd:/mnt/ssd:ro
    restart: unless-stopped
    networks:
      - server-net

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    ports:
      - "9000:9000"         # access via Tailscale: server-ts-ip:9000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/portainer:/data
    restart: unless-stopped
    networks:
      - server-net

  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_SCHEDULE: "0 0 3 * * *"   # 3am nightly
      WATCHTOWER_CLEANUP: "true"
      TZ: ${TZ}
      DOCKER_API_VERSION: "1.40"
    restart: unless-stopped
    networks:
      - server-net
