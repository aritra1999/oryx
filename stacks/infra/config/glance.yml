server:
  port: 8080

theme:
  background-color: 240 10 5
  primary-color: 217 92 83

pages:
  - name: Home
    columns:

      # ── Left sidebar — system, DNS, stats, admin ─────────────────────────
      - size: small
        widgets:

          - type: server-stats
            title: System
            servers:
              - type: local
                name: oryx
                mountpoints:
                  "/":
                    name: NVMe
                  "/mnt/ssd":
                    name: SSD
                  "/boot/efi":
                    hide: true

          - type: custom-api
            title: Photos
            cache: 1h
            url: http://immich-server:2283/api/server/statistics
            headers:
              x-api-key: ${IMMICH_API_KEY}
              Accept: application/json
            template: |
              <div class="flex justify-between text-center">
                <div>
                  <div class="color-highlight size-h3">{{ .JSON.Int "photos" | formatNumber }}</div>
                  <div class="size-h6">PHOTOS</div>
                </div>
                <div>
                  <div class="color-highlight size-h3">{{ .JSON.Int "videos" | formatNumber }}</div>
                  <div class="size-h6">VIDEOS</div>
                </div>
                <div>
                  <div class="color-highlight size-h3">{{ div (.JSON.Int "usage" | toFloat) 1073741824 | toInt | formatNumber }}GB</div>
                  <div class="size-h6">STORAGE</div>
                </div>
              </div>

          - type: bookmarks
            title: Admin
            groups:
              - title: Internal (Tailscale)
                links:
                  - title: Portainer
                    url: http://100.106.157.117:9000
                    icon: si:portainer
                  - title: Pi-hole
                    url: http://100.106.157.117:8053/admin
                    icon: si:pihole

      # ── Main column — search, services, markets, news ────────────────────
      - size: full
        widgets:

          - type: search
            autofocus: true
            search-engine: https://search.brave.com/search?q={QUERY}

          - type: monitor
            title: Services
            cache: 1m
            sites:
              - title: Notes
                url: https://notes.aritra.fyi
                icon: si:affine
              - title: Drive
                url: https://drive.aritra.fyi
                icon: si:nextcloud
              - title: Photos
                url: https://photos.aritra.fyi
                icon: si:immich
              - title: Grafana
                url: https://grafana.aritra.fyi
                icon: si:grafana
              - title: Status
                url: https://status.aritra.fyi
                icon: si:uptimekuma

          - type: markets
            title: Indices & Stocks
            markets:
              - symbol: SAP.DE
                name: SAP SE (Frankfurt)
              - symbol: "^GSPC"
                name: S&P 500
              - symbol: "^NSEI"
                name: Nifty 50
              - symbol: "^GDAXI"
                name: DAX 40
              - symbol: EURINR=X
                name: EUR / INR

          - type: group
            widgets:
              - type: rss
                title: Tech
                style: detailed-list
                limit: 20
                collapse-after: 8
                feeds:
                  - url: https://feeds.arstechnica.com/arstechnica/technology-lab
                    title: Ars Technica
                  - url: https://www.theverge.com/rss/index.xml
                    title: The Verge
                  - url: https://news.ycombinator.com/rss
                    title: Hacker News
                  - url: https://techcrunch.com/feed/
                    title: TechCrunch

              - type: rss
                title: World
                style: detailed-list
                limit: 20
                collapse-after: 8
                feeds:
                  - url: http://feeds.bbci.co.uk/news/world/rss.xml
                    title: BBC World
                  - url: https://feeds.skynews.com/feeds/rss/world.xml
                    title: Sky News
                  - url: https://rss.dw.com/rdf/rss-en-world
                    title: Deutsche Welle

              - type: rss
                title: Finance
                style: detailed-list
                limit: 20
                collapse-after: 8
                feeds:
                  - url: https://feeds.bloomberg.com/markets/news.rss
                    title: Bloomberg
                  - url: https://feeds.a.dj.com/rss/RSSMarketsMain.xml
                    title: Wall Street Journal
                  - url: https://www.ft.com/rss/home/uk
                    title: Financial Times

      # ── Right sidebar — time, weather, calendar ───────────────────────────
      - size: small
        widgets:

          - type: clock
            hour-format: 24h
            timezones:
              - timezone: Europe/Berlin
                label: Berlin
              - timezone: Asia/Kolkata
                label: Kolkata

          - type: weather
            location: Bonn, Germany
            units: metric
            hour-format: 24h

          - type: weather
            location: Ljubljana, Slovenia
            units: metric
            hour-format: 24h

          - type: weather
            location: Kolkata, India
            units: metric
            hour-format: 24h

          - type: calendar

  # ── System page ────────────────────────────────────────────────────────────
  - name: System
    columns:
      - size: small
        widgets:
          - type: server-stats
            title: System
            servers:
              - type: local
                name: oryx
                mountpoints:
                  "/":
                    name: NVMe
                  "/mnt/ssd":
                    name: SSD
                  "/boot/efi":
                    hide: true

      - size: full
        widgets:
          - type: docker-containers
            title: All Containers
            hide-by-default: false
            running-only: false
